global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: caddy
    static_configs:
      - targets: [caddy:9180]
  - job_name: business
    static_configs:
      - targets: [metrics:9108]
  - job_name: service-probes
    metrics_path: /probe
    params:
      module: [http_success]
    static_configs:
      - targets:
          - http://api:8080/api/v1/health/ready
          - http://web:3000/
          - http://scanner:8081/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
