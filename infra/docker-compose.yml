# ============================================================
# WEMOVE SPORTS 本地基础设施编排（PostgreSQL 16 + Redis 7）
# 用法（仓库根目录执行）：
#   npm run db:up      # 启动数据库
#   npm run db:down    # 停止
# 环境变量来自同目录 infra/.env（不提交，复制 .env.example 为 .env）
# ============================================================
name: wemove

services:
  postgres:
    image: postgres:16-alpine
    container_name: wemove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wemove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wemove_dev}
      POSTGRES_DB: ${POSTGRES_DB:-wemove}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wemove} -d ${POSTGRES_DB:-wemove}']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: wemove-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
