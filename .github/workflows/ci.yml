# WEMOVE SPORTS · CI（lint + 单测 + 构建 + DB 集成 e2e）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wemove
          POSTGRES_PASSWORD: wemove_dev
          POSTGRES_DB: wemove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wemove -d wemove"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://wemove:wemove_dev@localhost:5432/wemove?schema=public
      REDIS_URL: redis://localhost:6379/0
      E2E_DB: '1'
      JWT_ACCESS_SECRET: ci_dev_only_change_me
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Lint (workspaces, if present)
        run: npm run lint

      - name: Unit tests (workspaces, if present)
        run: npm test

      - name: Apply database migrations
        run: npm run db:deploy

      - name: E2E tests with DB (auth flow, E2E_DB gate)
        run: npm run test:e2e -w api

      - name: Build api
        run: npm run build:api

      - name: Build web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
